# Adds newly opened issues and pull requests to the shared Emulsify project board.
name: Add to projects

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

# The action authenticates with its PAT; it does not need GITHUB_TOKEN access.
permissions: {}

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          # Keep triage in the organization-level project used by maintainers.
          project-url: https://github.com/orgs/emulsify-ds/projects/6
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
