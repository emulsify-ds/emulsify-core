# Runs release-readiness checks once for PR updates and after integration merges.
name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [4.x, develop, main]

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '24.13.0'
          - '24.18.0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install
        # npm ci keeps release-readiness checks locked to package-lock.json.
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Storybook build
        run: npm run storybook-build
  package-readiness:
    name: Packed package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        # npm ci keeps packed-package checks locked to package-lock.json.
        run: npm ci
      - name: Verify package contents
        run: npm run pack:dry-run
      - name: Test packed package
        run: npm run smoke:pack
      - name: Verify release calculation
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_FROM: ${{ github.event.pull_request.base.sha }}
          RELEASE_TO: HEAD
          RELEASE_SQUASH_MESSAGE: ${{ github.event.pull_request.title }}
        run: npm run release:analyze
  fixture-builds:
    name: Fixture / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - drupal-sdc-src-components
          - no-platform-src-components
          - drupal-sdc-non-self-contained-output
          - non-self-contained-src-assets
          - non-self-contained-custom-asset-root
          - asset-rebase-disabled
          - wordpress-src-components
          - legacy-components
          - structure-implementations
          - mixed-storybook
          - large-twig-storybook
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        # npm ci keeps fixture checks locked to package-lock.json.
        run: npm ci
      - name: Fixture build
        run: npm run fixtures:release -- --fixture ${{ matrix.fixture }}
      - name: Upload mixed Storybook browser diagnostics
        if: failure() && matrix.fixture == 'mixed-storybook'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mixed-storybook-browser-diagnostics
          path: .out/fixture-browser-diagnostics/mixed-storybook
          if-no-files-found: ignore
  consumer-fixtures:
    name: Packed consumer / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - whisk-drupal
          - none
          - wordpress-twig
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        # npm ci keeps packed-consumer checks locked to package-lock.json.
        run: npm ci
      - name: Test packed consumer
        run: npm run fixtures:consumer -- --fixture ${{ matrix.fixture }}
  react-peer-fixtures:
    name: React peer / ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react:
          - '18'
          - '19'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        # npm ci keeps React peer checks locked to package-lock.json.
        run: npm ci
      - name: Test packed Storybook consumer
        run: npm run fixtures:consumer -- --fixture mixed-storybook --react ${{ matrix.react }}
