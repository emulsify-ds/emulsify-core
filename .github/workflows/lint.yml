name: Lint
on:
  push:
    branches: [develop, main, 3.x]
  pull_request:
    branches: [develop, main, 3.x]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
